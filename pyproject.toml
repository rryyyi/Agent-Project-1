[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jewelmentor"
version = "0.1.0"
description = "Inspectable multi-agent jewelry sales training with durable handoffs and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "rryyyi"}]
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
jewelmentor = "jewelmentor.cli:main"

[project.urls]
Repository = "https://github.com/rryyyi/Agent-Project-1"
Issues = "https://github.com/rryyyi/Agent-Project-1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jewelmentor = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
