name: Feature request
description: Propose a measurable improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe a concrete training or engineering scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and trade-offs
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      description: How could we verify the improvement without inflating proxy metrics?
